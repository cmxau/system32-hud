<title id="arch-title">session-hud architecture</title>
<desc id="arch-desc">Components of session-hud: Claude Code feeds the renderer through stdin JSON and the hook recorder through hook payloads; both share files under ~/.claude/session-hud; the renderer writes a summary file that the pane reads.</desc>
