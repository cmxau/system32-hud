<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="mode-title mode-desc">
<title id="mode-title">Layout by terminal width</title>
<desc id="mode-desc">Three auto-mode layouts: under 90 columns one compact line, 90 to 109 columns full rows, 110 columns or wider a one-line status line next to the docked side pane.</desc>
<defs>
<marker id="mode-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f5d75"/></marker>
<marker id="mode-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#eb6c36"/></marker>
</defs>
<rect width="1000" height="600" fill="#f5f5f5"/>
<line x1="20" y1="60" x2="980" y2="60" stroke="#4f5d75" stroke-width="1.4"/>
<line x1="20" y1="52" x2="20" y2="68" stroke="#2d3142" stroke-width="1.4"/><text x="20" y="44" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#4f5d75" text-anchor="middle" >0</text>
<line x1="320" y1="52" x2="320" y2="68" stroke="#2d3142" stroke-width="1.4"/><text x="320" y="44" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#4f5d75" text-anchor="middle" >90 cols</text>
<line x1="680" y1="52" x2="680" y2="68" stroke="#2d3142" stroke-width="1.4"/><text x="680" y="44" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#4f5d75" text-anchor="middle" >110 cols</text>
<text x="970" y="44" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#7a8399" text-anchor="end" >terminal width</text>
<text x="170" y="84" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="500" fill="#7a8399" text-anchor="middle" letter-spacing="1.2">COMPACT</text>
<text x="500" y="84" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="500" fill="#7a8399" text-anchor="middle" letter-spacing="1.2">ROWS</text>
<text x="830" y="84" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="500" fill="#7a8399" text-anchor="middle" letter-spacing="1.2">DOCKED</text>
<rect x="20" y="100" width="290" height="60" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
<text x="30" y="122" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >opus-5.5 · high │ ctx ▰▰▰▱▱ 41% │</text>
<text x="30" y="140" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >5h 24% ↻ 1h42m │ cost $1.84~</text>
<text x="20" y="184" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start" >width &lt; 90 (auto), or mode=compact</text>
<text x="20" y="200" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#4f5d75" text-anchor="start" >One line. Sections are added in `sections` order;</text>
<text x="20" y="213" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#4f5d75" text-anchor="start" >a segment that does not fit is skipped whole.</text>
<rect x="330" y="100" width="340" height="180" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
<text x="340" y="120" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >▌ opus-5.5 · high</text>
<text x="340" y="138" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >ctx    ▰▰▰▰▱▱▱▱▱▱ 41%  82k/200k</text>
<text x="340" y="156" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >limits 5h 24% ↻ 1h42m │ 7d 41% ↻ 2d7h</text>
<text x="340" y="174" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >cost   session $1.84~ today $7.20~</text>
<text x="340" y="192" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >week   opus-5.5 ▰▰▰▰▰ 8.2M $12.30~</text>
<text x="340" y="210" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >skills ●ponytail  62 available</text>
<text x="340" y="228" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >agents idle</text>
<text x="340" y="246" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >todos  ▸ Fix authentication bug (2/5)</text>
<text x="340" y="264" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >tools  ◐ Edit: auth.ts | ✓ Read ×3</text>
<text x="330" y="304" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start" >90 &lt;= width &lt; 110 (auto), or mode=rows</text>
<text x="330" y="320" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#4f5d75" text-anchor="start" >Every section is a row; long rows end in "…".</text>
<rect x="690" y="100" width="290" height="60" rx="6" fill="#fbe9e1" stroke="#eb6c36" stroke-width="1.5"/>
<text x="700" y="122" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >opus-5.5 · high │ ctx ▰▰▰▱▱ 41% │</text>
<text x="700" y="140" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >5h 24% ↻ 1h42m</text>
<text x="690" y="184" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="start" >width &gt;= 110 (auto, dockCols)</text>
<text x="690" y="200" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#4f5d75" text-anchor="start" >dockSections only, plus the todos row</text>
<text x="690" y="213" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#4f5d75" text-anchor="start" >when a list exists. dockCols=0 turns it off.</text>
<rect x="690" y="240" width="290" height="270" rx="6" fill="#f5f5f5" stroke="#4f5d75"/><line x1="830" y1="240" x2="830" y2="510" stroke="#bfc0c0"/><text x="700" y="260" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7a8399" text-anchor="start" >chat + prompt</text>
<text x="840" y="260" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#eb6c36" text-anchor="start" >side pane</text>
<text x="840" y="282" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >▌ session</text>
<text x="840" y="306" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >▌ context</text>
<text x="840" y="330" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >▌ limits</text>
<text x="840" y="354" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >▌ cost</text>
<text x="840" y="378" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >▌ todos</text>
<text x="840" y="402" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >▌ skills</text>
<text x="840" y="426" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >▌ agents</text>
<text x="840" y="450" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >▌ files</text>
<text x="840" y="474" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#2d3142" text-anchor="start" >▌ activity</text>
<text x="690" y="534" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#4f5d75" text-anchor="start" >The pane is opened by the mod (/hud). The status</text>
<text x="690" y="547" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#4f5d75" text-anchor="start" >line cannot see it, so docking is judged by width.</text>
<line x1="20" y1="576" x2="980" y2="576" stroke="#bfc0c0"/><text x="20" y="592" font-family="'Geist Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#4f5d75" text-anchor="start" >mode=rows or mode=compact ignores the widths. Width comes from $COLUMNS, 100 if unset.</text>
</svg>
