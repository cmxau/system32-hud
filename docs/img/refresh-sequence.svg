<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="seq-title seq-desc">
<title id="seq-title">One status-line refresh</title>
<desc id="seq-desc">Sequence of one status-line refresh: Claude Code pipes JSON to the renderer, which reads state and ledger, optionally spawns a detached scan and a cached git call, writes the summary file and prints rows.</desc>
